services:
  - type: web
    name: archpulse-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://archpulse-ai.vercel.app,https://archpulse-app.vercel.app
